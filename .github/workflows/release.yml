# Builds the Windows app on GitHub and publishes it as a release when a version tag is pushed:
#   git tag v1.0.0 && git push origin v1.0.0
# Building in CI from the public source keeps every release reproducible and auditable.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tag must match version.py
        if: startsWith(github.ref, 'refs/tags/')
        shell: python
        run: |
          import os, sys
          sys.path.insert(0, ".")
          from version import __version__
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          # A mismatch would make installed apps offer this same update forever.
          sys.exit(0 if tag == __version__ else f"tag v{tag} but version.py says {__version__}")

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run tests (including the live sheet format)
        env:
          JS_ONLINE_TESTS: "1"
        run: python -m unittest discover -s tests

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build app, portable zip and installer
        run: python tools/build.py

      - name: Self-test the built app
        shell: pwsh
        run: |
          $p = Start-Process dist\JungleSplits\JungleSplits.exe -ArgumentList "--self-test selftest.txt" -PassThru
          $p.WaitForExit()
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "self-test failed" }

      - name: Test the installer (install, relaunch, self-test, uninstall)
        shell: pwsh
        run: ./packaging/test_installer.ps1

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: jungle-splits-windows
          path: |
            dist/JungleSplits-Setup.exe
            dist/JungleSplits-Portable.zip
            dist/SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/JungleSplits-Setup.exe
            dist/JungleSplits-Portable.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
