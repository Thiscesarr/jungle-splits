# Builds the Windows app on GitHub and publishes it as a release when a version tag is pushed:
#   git tag v1.0.0 && git push origin v1.0.0
# Building in CI from the public source keeps every release reproducible and auditable.
#
# Installed apps download and run what a release holds, so what goes into one is kept tight:
# - actions are pinned to a commit (a tag such as v4 can be moved to other code);
# - Python packages are pinned by hash (requirements*.txt) and Inno Setup by version;
# - the job that runs all that code can only read the repository. A second job, which runs no code
#   from the repository or its dependencies, is the only one allowed to publish.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Tag must match version.py
        if: startsWith(github.ref, 'refs/tags/')
        shell: python
        run: |
          import os, sys
          sys.path.insert(0, "src")
          from version import __version__
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          # A mismatch would make installed apps offer this same update forever.
          sys.exit(0 if tag == __version__ else f"tag v{tag} but version.py says {__version__}")

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-build.txt

      - name: Run tests (including the live sheet format)
        env:
          JS_ONLINE_TESTS: "1"
        run: python -m unittest discover -s tests

      - name: Install Inno Setup
        run: choco install innosetup --version=6.7.1 --no-progress -y

      - name: Build app, portable zip and installer
        run: python tools/build.py

      - name: Self-test the built app
        shell: pwsh
        run: |
          $p = Start-Process dist\JungleSplits\JungleSplits.exe -ArgumentList "--self-test selftest.txt" -PassThru
          $p.WaitForExit()
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "self-test failed" }

      - name: Test the installer (install, relaunch, self-test, uninstall)
        shell: pwsh
        run: ./packaging/test_installer.ps1

      - name: Upload build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jungle-splits-windows
          if-no-files-found: error
          path: |
            dist/JungleSplits-Setup.exe
            dist/JungleSplits-Portable.zip
            dist/SHA256SUMS.txt

  publish:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get the release notes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: RELEASE_NOTES.md
          sparse-checkout-cone-mode: false

      - name: Get the build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: jungle-splits-windows
          path: dist

      - name: Check the files against their checksums
        working-directory: dist
        run: tr -d '\r' < SHA256SUMS.txt | sha256sum --check --strict

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          dist/JungleSplits-Setup.exe dist/JungleSplits-Portable.zip dist/SHA256SUMS.txt
          --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME"
          --notes-file RELEASE_NOTES.md --generate-notes
